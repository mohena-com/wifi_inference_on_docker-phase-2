version: '3.8'
services:
  gait_id_inference:
    build: .
    container_name: gait_id_inference
    command: ["/app/src/flask_real_time_inference.py", "/app", "wifi_project", "gait_id_config.properties", "False"]
    volumes:
      - .:/app
    ports:
      - "5002:5002"
    restart: unless-stopped
