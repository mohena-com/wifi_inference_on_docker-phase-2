<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CSI Inference — Upload</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 24px; max-width: 1100px; margin: auto; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    #results { margin-top: 16px; }
    canvas { max-width: 100%; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 6px 8px; border: 1px solid #eee; text-align: left; }
  </style>
</head>
<body>
  <h2>CSI Inference UI</h2>
  <div class="card">
    <label>Select CSV file (one recording):</label><br/>
    <input type="file" id="fileInput" accept=".csv" />
    <button id="uploadBtn">Upload & Predict</button>
    <div id="status" style="margin-top:8px;color: #444;"></div>
  </div>

  <div id="results"></div>

  <script src="app.js"></script>
</body>
</html>
